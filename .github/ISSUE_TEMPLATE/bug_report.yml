name: Reporte de bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Para temas de seguridad **no uses este
        formulario**: mira [SECURITY.md](../../blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Qué parte afecta
      options:
        - Simulador de PC (simulator/)
        - Vista previa web (tools/preview/)
        - Núcleo C compartido (common/)
        - Firmware M7 (m7/)
        - Firmware M4 (m4/)
        - SDK público (sdk/)
        - Build / CI
        - Documentación
        - No lo sé
    validations:
      required: true

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el comportamiento que ves.
      placeholder: Al tocar el botón HOME en Ajustes, la pantalla se queda en negro.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
      placeholder: Debería volver al launcher.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Arrancar el preview
        2. Tocar el mosaico Ajustes
        3. Tocar HOME en la barra inferior
    validations:
      required: true

  - type: textarea
    id: captura
    attributes:
      label: Captura de pantalla
      description: |
        Si es de la interfaz, **adjunta un PNG**. En la UI una imagen describe el
        problema mejor que un párrafo. Puedes generarlas con:
        `python3 tools/preview/shots.py` → `build_preview/shots/`.
        Arrastra el fichero aquí.

  - type: textarea
    id: logs
    attributes:
      label: Salida de error o logs
      description: Pega el texto, no una captura del texto.
      render: shell

  - type: input
    id: commit
    attributes:
      label: Commit o versión
      description: Salida de `git rev-parse --short HEAD`.
      placeholder: 7e013ae
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Dónde lo viste
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Placa Arduino GIGA real
        - CI de GitHub
    validations:
      required: true

  - type: checkboxes
    id: hardware
    attributes:
      label: Sobre hardware real
      options:
        - label: Lo probé en una placa GIGA física (no solo en el simulador)

  - type: checkboxes
    id: busca
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué si ya existe un issue igual
          required: true
