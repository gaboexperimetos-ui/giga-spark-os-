# Gigaspark OS - manifiesto de west
#
# Este fichero FALTABA. El CI ejecutaba `west init -l .` y `west update`, que
# requieren un manifiesto: sin el, ambos fallan y los jobs de firmware nunca
# pudieron compilar. Ahora el workspace es reproducible.
#
# Zephyr 4.5.0 (2026-10-28) es la ultima version estable publicada.
# Se importa el manifiesto de Zephyr para arrastrar sus modulos (HAL de ST,
# open-amp, libmetal y LVGL) en las revisiones que esa version prueba en conjunto.
#
# IMPORTANTE sobre LVGL: no se fija aqui una version propia. Zephyr arrastra su
# propio pin de LVGL (modules/lib/gui/lvgl) y sobrescribirlo rompe la integracion
# de drivers de display. La version efectiva es la que traiga este manifiesto.
#
# SDK: Zephyr 4.5.0 declara SDK_VERSION 1.0.1 (ver fichero SDK_VERSION del repo).
# Python: Zephyr 4.5.0 exige >= 3.12 (cmake/modules/python.cmake).
#
# Uso:
#   west init -l .
#   west update
#   west zephyr-export
#   west build -b arduino_giga_r1/stm32h747xx/m7 --shield arduino_giga_display_shield

manifest:
  version: "1.2"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        # Solo los modulos que este proyecto usa. Importar todo el manifiesto
        # de Zephyr descarga decenas de HALs de otros fabricantes (>1 GB) y
        # alarga mucho el CI sin aportar nada a un STM32H747.
        name-allowlist:
          - cmsis
          - cmsis-dsp
          - hal_stm32
          - open-amp
          - libmetal
          - lvgl
          - mbedtls
          - picolibc

  self:
    path: gigaspark-os
